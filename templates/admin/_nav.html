{% set tabs = [('admin.dashboard', 'Control center'), ('admin.metrics_page', 'Performance'), ('admin.sources', 'Sources & backfill'),
                ('admin.failures', 'Failures'), ('admin.merge', 'Merge entities'), ('admin.settings_page', 'Settings')] %}
<div class="mb-6 flex flex-wrap gap-1 border-b border-slate-200">
  {% for ep, label in tabs %}
    <a href="{{ url_for(ep) }}"
       class="-mb-px border-b-2 px-3 py-2 text-sm {{ 'border-blue-700 text-blue-700 font-medium' if request.endpoint == ep else 'border-transparent text-slate-600 hover:text-blue-700' }}">{{ label }}</a>
  {% endfor %}
</div>
